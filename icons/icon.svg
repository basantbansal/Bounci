<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#ffe3eb"/>
    </radialGradient>
    <radialGradient id="mochiBody" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fff0f4"/>
      <stop offset="100%" stop-color="#ffd5e2"/>
    </radialGradient>
    <radialGradient id="cheekGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7eb3" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ff9ec3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffaecb" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#e0637f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="128" height="128" rx="36" fill="url(#bgGlow)"/>

  <!-- Body Shadow + Mochi shape -->
  <g filter="url(#softShadow)">
    <!-- Base Squishy Body -->
    <path d="M 64 24 C 95 24 112 48 112 76 C 112 102 91 108 64 108 C 37 108 16 102 16 76 C 16 48 33 24 64 24 Z" fill="url(#mochiBody)"/>
  </g>

  <!-- Cheeks (Squishy Pull Points) -->
  <ellipse cx="32" cy="78" rx="14" ry="10" fill="url(#cheekGlow)"/>
  <ellipse cx="96" cy="78" rx="14" ry="10" fill="url(#cheekGlow)"/>

  <!-- Rosy accents -->
  <ellipse cx="32" cy="78" rx="7" ry="5" fill="#ff7089" opacity="0.6"/>
  <ellipse cx="96" cy="78" rx="7" ry="5" fill="#ff7089" opacity="0.6"/>

  <!-- Happy Eyes (curved lines) -->
  <path d="M 40 62 Q 47 55 54 62" fill="none" stroke="#5c4248" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 74 62 Q 81 55 88 62" fill="none" stroke="#5c4248" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Cute Mouth: (w) smile -->
  <path d="M 57 74 Q 61 78 64 74 Q 67 78 71 74" fill="none" stroke="#5c4248" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkles -->
  <path d="M 104 28 Q 106 34 112 36 Q 106 38 104 44 Q 102 38 96 36 Q 102 34 104 28 Z" fill="#ff7eb3"/>
  <circle cx="22" cy="38" r="3" fill="#ffb8cf"/>
</svg>