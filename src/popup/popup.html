<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bounci</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="popup-wrap">
      <!-- Header -->
      <header class="popup-header">
        <div class="brand">
          <div class="brand-logo">🥟</div>
          <div class="brand-info">
            <h1 class="brand-title">Bounci</h1>
            <p class="brand-sub">Squishy Cheek Physics</p>
          </div>
        </div>
        <button class="sound-toggle-btn" id="btnSoundToggle" title="Toggle Sound">
          <span id="soundIcon">🔊</span>
        </button>
      </header>

      <!-- Main Action Buttons -->
      <div class="action-grid">
        <button class="action-card action-primary" id="btnSnip">
          <div class="action-icon">✂️</div>
          <div class="action-text">
            <span class="action-title">Snip Page Area</span>
            <span class="action-desc">Select any area to squish</span>
          </div>
        </button>

        <button class="action-card" id="btnStudio">
          <div class="action-icon">🎨</div>
          <div class="action-text">
            <span class="action-title">Bounci Studio</span>
            <span class="action-desc">Full playground & GIF recorder</span>
          </div>
        </button>
      </div>

      <!-- Quick Sample Banner -->
      <button class="sample-banner" id="btnSample">
        <span class="sample-sparkle">✨</span>
        <span class="sample-text">Try with sample character</span>
        <span class="sample-arrow">➔</span>
      </button>

      <!-- Quick Settings -->
      <div class="quick-settings">
        <div class="setting-row">
          <span class="setting-label">Softness</span>
          <input type="range" class="slider" id="softnessSlider" min="0" max="1" step="0.05" value="0.5" />
          <span class="setting-val" id="softnessVal">50%</span>
        </div>
      </div>

      <!-- Footer tips -->
      <footer class="popup-footer">
        <p class="tip-text">💡 Tip: Right-click any image on the web and select <b>"Squish with Bounci ✨"</b></p>
      </footer>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
