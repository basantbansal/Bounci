<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bounci Overlay</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body class="overlay-mode" data-mode="empty">
    <div id="app">
      <main class="stage" id="stage">
        <!-- Thin top bar actions -->
        <div class="fluffy-top-bar" id="bounciTitleBar">
          <div class="fluffy-badge" id="bounciDragHandle" title="Drag to move overlay">
            <span class="fluffy-badge-icon">🥟</span>
            <span class="fluffy-badge-text">Bounci</span>
          </div>
          <div class="fluffy-drag-area" id="bounciDragArea" title="Drag to move overlay">
            <span class="fluffy-drag-grip"></span>
          </div>
          <div class="fluffy-top-actions">
            <button class="fluffy-action-btn" id="bounciBtnSnapshot" title="Copy Snapshot to Clipboard (C)" aria-label="Take Snapshot">
              <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </button>
            <button class="fluffy-action-btn" id="bounciBtnStudio" title="Open in Full Bounci Studio" aria-label="Open Studio">
              <span>↗</span>
            </button>
            <button class="fluffy-close-btn" id="bounciBtnClose" title="Close (Esc)" aria-label="Close">
              <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" fill="none">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Thin Fluffy Pill Controls -->
        <nav class="fluffy-pill" id="bounciPill" aria-label="Controls">
          <button class="fluffy-pill-btn" id="bounciBtnPaint" title="Paint Squishy Mask (P / 1)">
            <span class="fluffy-pill-icon">🖌️</span>
            <span class="fluffy-pill-label">Paint</span>
          </button>
          <div class="fluffy-pill-slider-wrap" title="Brush Size (Scroll wheel to adjust, [ / ])">
            <input type="range" class="fluffy-pill-slider" id="bounciBrushSize" min="0.01" max="0.25" step="0.005" value="0.07" title="Brush Size" />
          </div>
          <button class="fluffy-pill-btn fluffy-pill-btn-play active" id="bounciBtnPlay" title="Squish Cheeks! (Space / S / 2)">
            <span class="fluffy-pill-icon">✨</span>
            <span class="fluffy-pill-label">Play!</span>
          </button>
          <button class="fluffy-pill-btn fluffy-pill-btn-sub" id="bounciBtnAllMochi" title="Make entire image squishy">
            <span class="fluffy-pill-icon">🌟</span>
            <span class="fluffy-pill-label">All</span>
          </button>
        </nav>

        <!-- WebGL canvas -->
        <canvas id="gl"></canvas>
        <div id="brushCursor" class="brush-cursor" hidden></div>
        <div id="brushPreview" class="brush-preview" hidden></div>

        <button class="view-reset" id="btnResetView" hidden title="Reset View">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2.5 4.5v6H8.5" />
            <path d="M4.5 15a8 8 0 1 0 1.9-8.4L2.5 10.5" />
          </svg>
        </button>

        <!-- Empty state fallback if no image loaded yet -->
        <div class="empty-state" id="emptyState">
          <div class="dropcard">
            <div class="dropcard-icon">🥟</div>
            <p class="dropcard-title">Drop an image here</p>
            <p class="dropcard-sub">or click to pick from file</p>
            <div class="dropcard-actions">
              <button class="btn btn-primary" id="btnPick">Select Image</button>
              <button class="btn btn-ghost" id="btnSample">Try Sample</button>
            </div>
          </div>
        </div>

        <div class="toast-area" id="toastArea"></div>
      </main>
    </div>

    <input type="file" id="fileInput" accept="image/*" hidden />
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
